<ul class="menu menu--mobile">
  <li><button type="button" class="menu__trigger" aria-expanded="false" aria-controls="mobile-menu-links">Menu&nbsp;▾</button></li>
  <li>
    <ul id="mobile-menu-links" class="menu__dropdown" hidden>
      {{ range $.Site.Menus.main }}
        {{ if not .HasChildren }}
          <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
      {{ if and $.Site.Params.showLanguageSelector (len $.Site.Home.AllTranslations) }}
        <hr />
        {{ range $.Site.Home.AllTranslations }}
          <li>
            <a href="{{ .Permalink }}">{{ .Language.Label }}</a>
          </li>
        {{ end }}
      {{ end }}
    </ul>
  </li>
</ul>
